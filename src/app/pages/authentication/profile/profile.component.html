<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">Thông tin tài khoản</mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1">
    <form class="m-t-30" [formGroup]="formUser">
      <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block"
      >Ảnh tài khoản</mat-label
      >


      <mat-card appearance="outlined">
        <mat-card-content>
          <img [src]="base64File" height="200">
        </mat-card-content>
      </mat-card>
      <mat-form-field floatPlaceholder="never">

        <input [hidden]="true" (change)="onFileSelect($event)" type="file" accept="image/*" #fileSelect>
        <input readonly matInput formControlName="imgSrc" placeholder="Select file..."/>
        <button *ngIf="this.base64File" (click)="deleteFile()" matSuffix matTooltip="Remove selected file"
                [matTooltipPosition]="'above'" type="button" color="warn" mat-icon-button>
          <mat-icon>close</mat-icon>
        </button>
        <button matSuffix mat-icon-button (click)="fileSelect.click();"  matTooltip="Chọn file" [matTooltipPosition]="'above'">
          <mat-icon>file_upload</mat-icon>
        </button>
      </mat-form-field>
      <span *ngIf="this.base64File">Loading ... {{percentDone}}</span>

      <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block"
      >Tài khoản</mat-label
      >
      <mat-form-field appearance="outline" class="w-100" color="primary">
        <input matInput formControlName="userName"/>
        <mat-error *ngIf="formUser.get('userName')?.hasError('required')">
          Tài khoản không được để trống!
        </mat-error>
      </mat-form-field>
      <!-- password -->
      <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block"
      >Mật khẩu</mat-label
      >
      <mat-form-field appearance="outline" class="w-100" color="primary">
        <input matInput  formControlName="userPassword"/>
        <mat-error *ngIf="formUser.get('userPassword')?.hasError('required')">
          Mật khẩu không được để trống!
        </mat-error>
      </mat-form-field>



      <mat-grid-list cols="3" rowHeight="3:1">
        <mat-grid-tile><a mat-flat-button color="primary" class="w-100" >Cập nhật</a></mat-grid-tile>
      </mat-grid-list>


      <!-- input -->
    </form>
  </mat-card-content>
</mat-card>
